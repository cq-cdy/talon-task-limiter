name: build-and-test
on: [push, pull_request]
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        shared: ["ON", "OFF"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libc++ for TSan exception paths
        if: matrix.sanitizer == 'thread'
        run: sudo apt-get update && sudo apt-get install -y clang libc++-dev libc++abi-dev
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.sanitizer }}" = thread ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DTALON_TASK_LIMITER_SANITIZER=thread -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTALON_TASK_LIMITER_SANITIZER=address -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          fi
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --parallel 2
