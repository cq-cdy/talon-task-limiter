name: build-and-test
on: [push, pull_request]
jobs:
  style:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install style tools
        run: sudo apt-get update && sudo apt-get install -y clang-format-12 clang-tidy-12
      - name: Configure
        run: cmake -S . -B build-style -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON -DTALON_TASK_LIMITER_BUILD_BENCHMARKS=ON
      - name: Check Google style and braces
        run: python3 tools/check_style.py --build-dir build-style
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
        shared: ["ON", "OFF"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC environment for compiler probes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$installation) { throw 'Visual Studio C++ tools were not found' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd /s /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|PATH)=') { $_ >> $env:GITHUB_ENV }
          }
          if ($LASTEXITCODE -ne 0) { throw 'MSVC environment setup failed' }
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler for TSan runtime
        if: matrix.sanitizer == 'thread'
        run: sudo apt-get update && sudo apt-get install -y clang-12 libclang-common-12-dev
      - name: Build instrumented standard library
        if: matrix.sanitizer == 'thread'
        run: python3 tools/build_tsan_runtime.py --jobs 4
      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.sanitizer }}" = thread ]; then
            runtime_prefix="$PWD/build-toolchain/tsan-runtime"
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++-12 \
              "-DCMAKE_CXX_FLAGS=-stdlib=libc++ -fsanitize=thread -fno-omit-frame-pointer -isystem $runtime_prefix/include/c++/v1" \
              "-DCMAKE_EXE_LINKER_FLAGS=-L $runtime_prefix/lib -Wl,-rpath,$runtime_prefix/lib" \
              -DTALON_TASK_LIMITER_SANITIZER=thread -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTALON_TASK_LIMITER_SANITIZER=address -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          fi
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure --parallel 2
